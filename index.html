<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard GuatePro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f2f8;--text2:#8b92a8;--text3:#555d75;--accent:#4f8ef7;--green:#22c97a;--red:#f25c5c;--amber:#f7a84f;--purple:#a78bfa;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.nav-brand{font-size:15px;font-weight:700}.nav-brand span{color:var(--accent)}
.nav-tabs{display:flex;gap:3px}
.tab{padding:5px 12px;border-radius:var(--rs);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.tab:hover{background:var(--bg3);color:var(--text)}.tab.active{background:var(--accent);color:#fff}
.nav-right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3)}
.upd-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:6px 14px;border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:500}
.upd-btn:hover{background:var(--accent);border-color:var(--accent)}
.rate{background:var(--bg3);border:1px solid var(--border);padding:3px 9px;border-radius:20px}
.rate strong{color:var(--green)}
.page{display:none;padding:1.5rem;max-width:1400px;margin:0 auto}.page.active{display:block}
.sec{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;margin-top:1.2rem}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:1.5rem}
.kcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem}
.klabel{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.kval{font-size:22px;font-weight:700;line-height:1;margin-bottom:3px}.ksub{font-size:10px;color:var(--text3)}
.cg{color:var(--green)}.cr{color:var(--red)}.ca{color:var(--amber)}.cb{color:var(--accent)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.ccart{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem}
.ctitle{font-size:12px;font-weight:600;margin-bottom:.8rem}.cwrap{position:relative;height:220px}
.tcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1.5rem}
.th2{padding:.9rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tt{font-size:12px;font-weight:600}.tc{font-size:11px;color:var(--text3)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg3);color:var(--text3);font-size:10px;font-weight:600;text-transform:uppercase;padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:var(--bg3)}
.badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.bg{background:rgba(34,201,122,.12);color:var(--green)}.br{background:rgba(242,92,92,.12);color:var(--red)}
.ba{background:rgba(247,168,79,.12);color:var(--amber)}.bb{background:rgba(79,142,247,.12);color:var(--accent)}
.bp{background:rgba(167,139,250,.12);color:var(--purple)}.bgr{background:rgba(139,146,168,.12);color:var(--text2)}
.alert{background:rgba(242,92,92,.07);border:1px solid rgba(242,92,92,.2);border-radius:var(--r);padding:.9rem 1.1rem;margin-bottom:1rem;font-size:12px}
.alert strong{color:var(--red)}.alerta{background:rgba(247,168,79,.07);border-color:rgba(247,168,79,.2)}.alerta strong{color:var(--amber)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:1.5rem}
.lcard{background:var(--bg2);border:1px solid rgba(242,92,92,.25);border-left:3px solid var(--red);border-radius:var(--r);padding:1.1rem}
.lname{font-size:13px;font-weight:600}.lguide{font-size:10px;color:var(--accent);font-family:monospace;margin-top:2px}
.lrows{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.lrow{display:flex;gap:8px;font-size:11px}.lk{color:var(--text3);min-width:80px}.lv{color:var(--text)}
.dbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.dok{background:rgba(247,168,79,.12);color:var(--amber)}.dbad{background:rgba(242,92,92,.12);color:var(--red)}
.filters{display:flex;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center}
.fl{font-size:11px;color:var(--text3)}
select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:6px 10px;border-radius:var(--rs);font-size:12px;outline:none;cursor:pointer}
.freset{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:6px 12px;border-radius:var(--rs);cursor:pointer;font-size:11px}
.freset:hover{border-color:var(--red);color:var(--red)}
.fingrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:1.5rem}
.fcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem}
.fprod{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.frow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.frow:last-child{border-bottom:none;padding-top:8px}
.flabel{color:var(--text2)}.fval{font-weight:600}
.ftot .flabel{color:var(--text);font-weight:600;font-size:12px}.ftot .fval{color:var(--green);font-size:13px}
.floss{color:var(--red)}.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:12px}
@media(max-width:768px){.charts-row{grid-template-columns:1fr}.nav-tabs{display:none}}
.refresh-btn{background:var(--accent);border:none;color:#fff;padding:6px 14px;border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.refresh-btn:hover{background:var(--accent2,#3a6fd4)}
.refresh-btn:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>

const exchangeRate = 7.75;
let charts = {};

function showPage(p,el){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  el.classList.add('active');
}
function parseDate(s){
  if(!s)return null;s=s.toString().trim();
  const p=s.includes('/')?s.split('/'):s.split('-');
  if(p.length===3){const[d,m,y]=p;return new Date(parseInt(y),parseInt(m)-1,parseInt(d));}
  return null;
}
function daysDiff(s){const d=parseDate(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.floor((t-d)/86400000);}
function pct(a,b){if(!b||b===0)return 0;return Math.round((a/b)*1000)/10;}
function gtq(v){return parseFloat(v)||0;}
function fmt(n){return Number(n).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});}
function usd(v){return fmt(gtq(v)/exchangeRate);}
function getMetrics(rows){
  const e=rows.filter(r=>r.ESTATUS==='ENTREGADO').length;
  const d=rows.filter(r=>r.ESTATUS==='DEVOLUCION').length;
  const i=rows.filter(r=>r.ESTATUS==='INCIDENCIA EN RUTA').length;
  const den=e+d+i;
  return{e,d,i,den,pReal:pct(e,den),pEfect:e>0?Math.round((1-(i+d)/e)*1000)/10:0,pDev:pct(d,den)};
}
function sBadge(s){
  const m={'ENTREGADO':'bg','CANCELADO':'bgr','DEVOLUCION':'br','RECHAZADO':'br','INCIDENCIA EN RUTA':'ba','RECOLECTADO':'bb','PREPARADO PARA TRANSPORTADORA':'bb','PENDIENTE':'bp','PENDIENTE CONFIRMACION':'bp','GUIA_GENERADA':'bb'};
  return`<span class="badge ${m[s]||'bgr'}">${s}</span>`;
}

function renderResumen(){
  const m=getMetrics(allData);
  const active=['RECOLECTADO','PREPARADO PARA TRANSPORTADORA','GUIA_GENERADA','INCIDENCIA EN RUTA','PENDIENTE','PENDIENTE CONFIRMACION'];
  const ret=allData.filter(r=>active.includes(r.ESTATUS)&&daysDiff(r['ULTIMO MOV'])>10).length;
  const totalG=allData.filter(r=>r.ESTATUS==='ENTREGADO').reduce((s,r)=>s+gtq(r.GANANCIA),0);

  document.getElementById('resumenContent').innerHTML=`
  <div class="sec">Resumen general</div>
  <div class="kgrid">
    <div class="kcard"><div class="klabel">Total pedidos</div><div class="kval cb">${allData.length.toLocaleString()}</div></div>
    <div class="kcard"><div class="klabel">Entregados</div><div class="kval cg">${m.e.toLocaleString()}</div></div>

    <div class="kcard"><div class="klabel">% Entrega efectivo</div><div class="kval ca">${m.pEfect}%</div></div>

    <div class="kcard"><div class="klabel">Ganancia neta</div><div class="kval cg">Q${fmt(totalG)}</div><div class="ksub">≈ $${usd(totalG)}</div></div>
  </div>
  <div class="charts-row">
    <div class="ccart"><div class="ctitle">Distribución de estados</div><div class="cwrap"><canvas id="chE"></canvas></div></div>
    <div class="ccart"><div class="ctitle">Entregas vs Devoluciones por producto</div><div class="cwrap"><canvas id="chP"></canvas></div></div>
  </div>

    <div class="ccart"><div class="ctitle">Pedidos por fecha de guía (últimos 30 días)</div><div class="cwrap"><canvas id="chT"></canvas></div></div>
    <div class="ccart"><div class="ctitle">Top 10 departamentos por volumen</div><div class="cwrap"><canvas id="chD"></canvas></div></div>
  </div>`;
  setTimeout(()=>{
    const sc={'ENTREGADO':'#22c97a','CANCELADO':'#555d75','DEVOLUCION':'#f25c5c','RECHAZADO':'#c43e3e','INCIDENCIA EN RUTA':'#f7a84f','RECOLECTADO':'#4f8ef7','PREPARADO PARA TRANSPORTADORA':'#3a6fd4','PENDIENTE':'#a78bfa','PENDIENTE CONFIRMACION':'#7c6bd4','GUIA_GENERADA':'#5ab4f7'};
    const sc2={};allData.forEach(r=>{sc2[r.ESTATUS]=(sc2[r.ESTATUS]||0)+1;});
    charts.e=new Chart(document.getElementById('chE'),{type:'doughnut',data:{labels:Object.keys(sc2),datasets:[{data:Object.values(sc2),backgroundColor:Object.keys(sc2).map(k=>sc[k]||'#888'),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8b92a8',font:{size:10},boxWidth:10}}}}});
    const prods=[...new Set(allData.map(r=>r.PRODUCTO.trim()))].filter(Boolean);
    charts.p=new Chart(document.getElementById('chP'),{type:'bar',data:{labels:prods.map(p=>p.length>15?p.slice(0,15)+'…':p),datasets:[{label:'Entregados',data:prods.map(p=>allData.filter(r=>r.PRODUCTO.trim()===p&&r.ESTATUS==='ENTREGADO').length),backgroundColor:'#22c97a'},{label:'Devoluciones',data:prods.map(p=>allData.filter(r=>r.PRODUCTO.trim()===p&&r.ESTATUS==='DEVOLUCION').length),backgroundColor:'#f25c5c'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b92a8',font:{size:10}}}},scales:{x:{ticks:{color:'#555d75',font:{size:9}},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#555d75'},grid:{color:'rgba(255,255,255,0.04)'}}}}});
    const tend={};allData.forEach(r=>{if(r['FECHA GUIA']){const d=parseDate(r['FECHA GUIA']);if(d){const k=d.toISOString().slice(0,10);tend[k]=(tend[k]||0)+1;}}});
    const tk=Object.keys(tend).sort().slice(-30);
    charts.t=new Chart(document.getElementById('chT'),{type:'line',data:{labels:tk,datasets:[{label:'Pedidos',data:tk.map(k=>tend[k]),borderColor:'#4f8ef7',backgroundColor:'rgba(79,142,247,0.08)',fill:true,tension:0.4,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#555d75',font:{size:9},maxTicksLimit:10},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#555d75'},grid:{color:'rgba(255,255,255,0.04)'}}}}});
    const dc={};allData.forEach(r=>{if(r.DEPTO)dc[r.DEPTO]=(dc[r.DEPTO]||0)+1;});

function renderLogistica(){
  const inc=allData.filter(r=>r.ESTATUS==='INCIDENCIA EN RUTA');
  const active=['RECOLECTADO','PREPARADO PARA TRANSPORTADORA','GUIA_GENERADA','INCIDENCIA EN RUTA','PENDIENTE','PENDIENTE CONFIRMACION'];
  const ret=allData.filter(r=>active.includes(r.ESTATUS)&&daysDiff(r['ULTIMO MOV'])>10);
  document.getElementById('logisticaContent').innerHTML=`
  <div class="sec">Panel logístico</div>
  ${inc.length>0?`<div class="alert"><strong>🚨 ${inc.length} pedidos en INCIDENCIA EN RUTA</strong> — requieren gestión inmediata.</div>`:''}
  ${ret.length>0?`<div class="alert alerta"><strong>⏱ ${ret.length} pedidos sin movimiento +10 días</strong> — verificar con transportadora.</div>`:''}
  <div class="sec">Incidencias en ruta</div>
  <div class="lgrid">${inc.length===0?'<div class="empty">No hay incidencias ✓</div>':inc.map(r=>{const dias=daysDiff(r['ULTIMO MOV']);return`<div class="lcard"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="lname">${r['NOMBRE CLIENTE']}</div><div class="lguide">${r['NUMERO GUIA']||'Sin guía'}</div></div><span class="dbadge ${dias>10?'dbad':'dok'}">${dias!==null?dias+'d':'?'}</span></div><div class="lrows"><div class="lrow"><span class="lk">Teléfono</span><span class="lv">${r.TELEFONO}</span></div><div class="lrow"><span class="lk">Producto</span><span class="lv">${r.PRODUCTO}</span></div><div class="lrow"><span class="lk">Destino</span><span class="lv">${r.DEPTO} — ${r.CIUDAD}</span></div><div class="lrow"><span class="lk">Fecha pedido</span><span class="lv">${r.FECHA}</span></div><div class="lrow"><span class="lk">Guía generada</span><span class="lv">${r['FECHA GUIA']||'N/D'}</span></div><div class="lrow"><span class="lk">Último mov.</span><span class="lv">${r['ULTIMO MOV']||'N/D'}</span></div>${r.NOVEDAD?`<div class="lrow"><span class="lk">Novedad</span><span class="lv" style="color:var(--amber)">${r.NOVEDAD}</span></div>`:''}</div></div>`;}).join('')}</div>
  <div class="sec">Pedidos sin movimiento +10 días</div>
  <div class="tcard"><div class="th2"><span class="tt">Pedidos retrasados</span><span class="tc">${ret.length} pedidos</span></div><div class="tw"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Guía</th><th>Estado</th><th>Producto</th><th>Depto</th><th>Último mov.</th><th>Días</th></tr></thead><tbody>${ret.length===0?'<tr><td colspan="8" class="empty">Sin retrasados ✓</td></tr>':ret.map(r=>{const dias=daysDiff(r['ULTIMO MOV']);return`<tr><td>${r['NOMBRE CLIENTE']}</td><td>${r.TELEFONO}</td><td style="color:var(--accent);font-family:monospace">${r['NUMERO GUIA']||'—'}</td><td>${sBadge(r.ESTATUS)}</td><td>${r.PRODUCTO}</td><td>${r.DEPTO}</td><td>${r['ULTIMO MOV']||'—'}</td><td><span class="dbadge dbad">${dias!==null?dias+'d':'?'}</span></td></tr>`;}).join('')}</tbody></table></div></div>`;
}

function renderProductos(){
  const prods=[...new Set(allData.map(r=>r.PRODUCTO.trim()))].filter(Boolean).sort();
  document.getElementById('productosContent').innerHTML=`<div class="sec">Análisis por producto</div><div class="filters"><span class="fl">Filtrar:</span><select id="fP" onchange="filterProd()"><option value="">Todos</option>${prods.map(p=>`<option>${p}</option>`).join('')}</select></div><div class="tcard"><div class="th2"><span class="tt">Métricas por producto</span></div><div class="tw"><table><thead><tr><th>Producto</th><th>Total</th><th>Entregados</th><th>Devoluciones</th><th>Incidencias</th><th>% Entrega real</th><th>% Entrega efectivo</th><th>% Dev. real</th></tr></thead><tbody id="pBody">${prods.map(pRow).join('')}</tbody></table></div></div>`;
}
function pRow(p){const rows=allData.filter(r=>r.PRODUCTO.trim()===p);const m=getMetrics(rows);return`<tr><td style="font-weight:600">${p}</td><td>${rows.length}</td><td style="color:var(--green)">${m.e}</td><td style="color:var(--red)">${m.d}</td><td style="color:var(--amber)">${m.i}</td><td><span class="badge ${m.pReal>=70?'bg':'br'}">${m.pReal}%</span></td><td><span class="badge ${m.pEfect>=70?'bg':'br'}">${m.pEfect}%</span></td><td><span class="badge ${m.pDev<=20?'bg':'br'}">${m.pDev}%</span></td></tr>`;}
function filterProd(){const f=document.getElementById('fP').value;const prods=f?[f]:[...new Set(allData.map(r=>r.PRODUCTO.trim()))].filter(Boolean).sort();document.getElementById('pBody').innerHTML=prods.map(pRow).join('');}

function renderGeografico(){
  const deptos=[...new Set(allData.map(r=>r.DEPTO))].filter(Boolean).sort();
  const prods=[...new Set(allData.map(r=>r.PRODUCTO.trim()))].filter(Boolean).sort();
  document.getElementById('geograficoContent').innerHTML=`<div class="sec">Análisis geográfico</div><div class="filters"><span class="fl">Departamento:</span><select id="fD" onchange="filterGeo()"><option value="">Todos</option>${deptos.map(d=>`<option>${d}</option>`).join('')}</select><span class="fl">Producto:</span><select id="fGP" onchange="filterGeo()"><option value="">Todos</option>${prods.map(p=>`<option>${p}</option>`).join('')}</select><button class="freset" onclick="document.getElementById('fD').value='';document.getElementById('fGP').value='';filterGeo()">Limpiar</button></div><div class="tcard"><div class="th2"><span class="tt">Por departamento y ciudad</span><span class="tc" id="gCnt"></span></div><div class="tw"><table><thead><tr><th>Departamento</th><th>Ciudad</th><th>Total</th><th>Entregados</th><th>Devoluciones</th><th>Incidencias</th><th>% Entrega real</th><th>% Dev. real</th></tr></thead><tbody id="gBody"></tbody></table></div></div>`;
  filterGeo();
}
function filterGeo(){
  const fd=document.getElementById('fD')?document.getElementById('fD').value:'';
  const fp=document.getElementById('fGP')?document.getElementById('fGP').value:'';
  let f=allData;if(fd)f=f.filter(r=>r.DEPTO===fd);if(fp)f=f.filter(r=>r.PRODUCTO.trim()===fp);
  const g={};f.forEach(r=>{const k=`${r.DEPTO}|||${r.CIUDAD}`;if(!g[k])g[k]=[];g[k].push(r);});
  const rows=Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
  if(document.getElementById('gCnt'))document.getElementById('gCnt').textContent=`${rows.length} ciudades`;
  if(document.getElementById('gBody'))document.getElementById('gBody').innerHTML=rows.map(([k,rws])=>{const[dep,ciu]=k.split('|||');const m=getMetrics(rws);return`<tr><td style="font-weight:600">${dep}</td><td>${ciu}</td><td>${rws.length}</td><td style="color:var(--green)">${m.e}</td><td style="color:var(--red)">${m.d}</td><td style="color:var(--amber)">${m.i}</td><td><span class="badge ${m.pReal>=70?'bg':'br'}">${m.pReal}%</span></td><td><span class="badge ${m.pDev<=20?'bg':'br'}">${m.pDev}%</span></td></tr>`;}).join('');
}

function renderFinanciero(){
  const prods=[...new Set(allData.map(r=>r.PRODUCTO.trim()))].filter(Boolean).sort();
  let tG=0,tF=0,tFD=0;
  const cards=prods.map(p=>{
    const ent=allData.filter(r=>r.PRODUCTO.trim()===p&&r.ESTATUS==='ENTREGADO');
    const dev=allData.filter(r=>r.PRODUCTO.trim()===p&&r.ESTATUS==='DEVOLUCION');
    const ing=ent.reduce((s,r)=>s+gtq(r.TOTAL),0);
    const cp=ent.reduce((s,r)=>s+gtq(r['COSTO PROD']),0);
    const fl=ent.reduce((s,r)=>s+gtq(r.FLETE),0);
    const fd=dev.reduce((s,r)=>s+gtq(r['FLETE DEV']),0);
    const gan=ing-cp-fl-fd;tG+=gan;tF+=fl;tFD+=fd;
    return`<div class="fcard"><div class="fprod">${p}</div><div class="frow"><span class="flabel">Entregados</span><span class="fval">${ent.length}</span></div><div class="frow"><span class="flabel">Ingresos brutos</span><span class="fval">Q${fmt(ing)}</span></div><div class="frow"><span class="flabel">Costo producto</span><span class="fval floss">−Q${fmt(cp)}</span></div><div class="frow"><span class="flabel">Fletes envío</span><span class="fval floss">−Q${fmt(fl)}</span></div><div class="frow"><span class="flabel">Fletes devolución</span><span class="fval floss">−Q${fmt(fd)}</span></div><div class="frow ftot"><span class="flabel">Ganancia neta</span><span class="fval ${gan<0?'floss':''}">${gan<0?'−':''}Q${fmt(Math.abs(gan))} <small style="color:var(--text3)">≈$${fmt(Math.abs(gan)/exchangeRate)}</small></span></div></div>`;
  });
  const devR=prods.map(p=>{const dev=allData.filter(r=>r.PRODUCTO.trim()===p&&r.ESTATUS==='DEVOLUCION');if(!dev.length)return'';const fd=dev.reduce((s,r)=>s+gtq(r['FLETE DEV']),0);const cp=dev.reduce((s,r)=>s+gtq(r['COSTO PROD']),0);const ip=dev.reduce((s,r)=>s+gtq(r.TOTAL),0);const tot=fd+cp+ip;return`<tr><td style="font-weight:600">${p}</td><td style="color:var(--red)">${dev.length}</td><td>Q${fmt(fd)}</td><td>Q${fmt(cp)}</td><td>Q${fmt(ip)}</td><td style="color:var(--red);font-weight:600">Q${fmt(tot)}</td><td style="color:var(--red);font-weight:600">$${fmt(tot/exchangeRate)}</td></tr>`;}).filter(Boolean).join('');
  document.getElementById('financieroContent').innerHTML=`<div class="sec">Análisis financiero</div><div class="kgrid"><div class="kcard"><div class="klabel">Ganancia total neta</div><div class="kval cg">Q${fmt(tG)}</div><div class="ksub">≈ $${fmt(tG/exchangeRate)}</div></div><div class="kcard"><div class="klabel">Total fletes pagados</div><div class="kval ca">Q${fmt(tF)}</div><div class="ksub">≈ $${fmt(tF/exchangeRate)}</div></div><div class="kcard"><div class="klabel">Costo fletes devolución</div><div class="kval cr">Q${fmt(tFD)}</div><div class="ksub">≈ $${fmt(tFD/exchangeRate)}</div></div></div><div class="sec">Rentabilidad por producto</div><div class="fingrid">${cards.join('')}</div><div class="sec">Impacto económico de devoluciones</div><div class="tcard"><div class="th2"><span class="tt">Costo de devoluciones por producto</span></div><div class="tw"><table><thead><tr><th>Producto</th><th>Devoluciones</th><th>Flete dev. (GTQ)</th><th>Costo producto (GTQ)</th><th>Ingreso perdido (GTQ)</th><th>Impacto total (GTQ)</th><th>Impacto total (USD)</th></tr></thead><tbody>${devR||'<tr><td colspan="7" class="empty">Sin devoluciones</td></tr>'}</tbody></table></div></div>`;
}

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxwBBYa7uz5Ks81qZj8nxHNBKiyeKUxudbu7Igq1-kL8tR9CFwu8JQwQNArq9FMj_rw/exec';

function mapRow(r) {
  return {
    'FECHA': String(r['FECHA']||'').trim(),
    'NOMBRE CLIENTE': String(r['NOMBRE CLIENTE']||'').trim(),
    'TELEFONO': String(r['TELÉFONO']||r['TELEFONO']||'').trim(),
    'NUMERO GUIA': String(r['NÚMERO GUIA']||r['NUMERO GUIA']||'').trim(),
    'ESTATUS': String(r['ESTATUS']||'').trim(),
    'PRODUCTO': String(r['PRODUCTO']||'').trim(),
    'DEPTO': String(r['DEPARTAMENTO DESTINO']||'').trim(),
    'CIUDAD': String(r['CIUDAD DESTINO']||'').trim(),
    'FECHA GUIA': String(r['FECHA GUIA GENERADA']||'').trim(),
    'ULTIMO MOV': String(r['FECHA DE ÚLTIMO MOVIMIENTO']||r['FECHA DE ULTIMO MOVIMIENTO']||'').trim(),
    'TOTAL': String(r['TOTAL DE LA ORDEN']||'').trim(),
    'GANANCIA': String(r['GANANCIA']||'').trim(),
    'FLETE': String(r['PRECIO FLETE']||'').trim(),
    'FLETE DEV': String(r['COSTO DEVOLUCION FLETE']||'').trim(),
    'COSTO PROD': String(r['PRECIO PROVEEDOR X CANTIDAD']||'').trim(),
    'NOVEDAD': String(r['NOVEDAD']||'').trim(),
  };
}

function refreshData() {
  const btn = document.getElementById('refreshBtn');
  const upd = document.getElementById('lastUpdate');
  if(btn){btn.textContent='&#8635; Cargando...';btn.disabled=true;}
  
  // Remove old script tag if exists
  const old = document.getElementById('jsonp-script');
  if(old) old.remove();
  
  // Define callback
  window.__sheetCallback = function(raw) {
    try {
      allData = raw.map(mapRow);
      if(upd) upd.textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-GT');
      renderResumen();renderLogistica();renderProductos();renderGeografico();renderFinanciero();
    } catch(e) {
      alert('Error procesando datos: ' + e.message);
    }
    if(btn){btn.textContent='&#8635; Actualizar';btn.disabled=false;}
    const s = document.getElementById('jsonp-script');
    if(s) s.remove();
  };
  
  // Set timeout for error handling
  const timer = setTimeout(function() {
    if(btn){btn.textContent='&#8635; Actualizar';btn.disabled=false;}
    alert('Error al actualizar: timeout. Verifica que el Apps Script esté publicado correctamente.');
  }, 15000);
  
  window.__sheetCallbackWrapped = function(raw) {
    clearTimeout(timer);
    window.__sheetCallback(raw);
  };
  
  const script = document.createElement('script');
  script.id = 'jsonp-script';
  script.src = SHEET_URL + '?callback=__sheetCallbackWrapped';
  script.onerror = function() {
    clearTimeout(timer);
    if(btn){btn.textContent='&#8635; Actualizar';btn.disabled=false;}
    alert('Error al cargar el script. Verifica tu conexión y que el Apps Script esté publicado.');
  };
  document.head.appendChild(script);
}

renderResumen();renderLogistica();renderProductos();renderGeografico();renderFinanciero();
</script>
